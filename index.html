    <button class="toggle-btn" id="togglePanel" type="button">Collapse</button>

</div>

const map = L.map('map', { zoomControl: true, tap: true }).setView([36.45, 127.95], 7);
const baseLayers = {
  osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors',
    zIndex: 100
  }),
  topoXc: L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
    maxNativeZoom: 17,
    maxZoom: 18,
    attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap',
    zIndex: 100
  }),
  topoGrey: L.tileLayer('https://sgx.geodatenzentrum.de/wmts_topplus_open/tile/1.0.0/web_grau/default/WEBMERCATOR/{z}/{y}/{x}.png', {
    maxNativeZoom: 18,
    maxZoom: 18,
    attribution: 'Map data: &copy; <a href="https://www.govdata.de/dl-de/by-2-0">dl-de/by-2-0</a>',
    zIndex: 100
  }),
  satellite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxNativeZoom: 17,
    maxZoom: 18,
    attribution: 'Satellite &copy; Esri',
    zIndex: 100
  })
};
let activeBaseLayer = baseLayers.osm;
activeBaseLayer.addTo(map);

const kk7RasterLayerConfigs = {
  certainty: { tileName: 'knowledges', maxNativeZoom: 12, className: 'invertalpha' },
  skyways: { tileName: 'skyways', maxNativeZoom: 13 },
  thermals: { tileName: 'thermals', maxNativeZoom: 12 }
};
const activeKk7RasterLayers = {};
let activeHotspotsLayer = null;
let hotspotRequestId = 0;
let hotspotReloadTimer = null;

function thermalSource(){
  return encodeURIComponent(window.location.hostname || 'local-file');
}
function currentSeasonKey(date = new Date()){
  const month = date.getMonth();
  if(month === 11 || month <= 1) return 'jan';
  if(month >= 2 && month <= 4) return 'apr';
  if(month >= 5 && month <= 7) return 'jul';
  return 'oct';
}
function selectedValue(name, fallback){
  const input = document.querySelector(`input[name="${name}"]:checked`);
  return input ? input.value : fallback;
}
function kk7Category(){
  if(!document.getElementById('timeFilter').checked) return 'all_all';
  return `${selectedValue('season', currentSeasonKey())}_${selectedValue('timeOfDay', 'all')}`;
}
function layerOpacity(){
  return Number(document.getElementById('thermalOpacity').value);
}
function optionLabel(selector, fallback = ''){
  const input = document.querySelector(selector);
  const label = input ? input.closest('label') : null;
  return label ? label.textContent.trim() : fallback;
}
function enabledKk7LayerLabels(){
  return [...document.querySelectorAll('.kk7-raster-layer:checked')]
    .map((input) => input.closest('label').textContent.trim())
    .concat(document.getElementById('hotspotsLayer').checked ? ['Hotspots'] : []);
}
function updateLayerSummary(){
  const base = optionLabel('input[name="baseLayer"]:checked', 'OSM');
  const kk7Layers = enabledKk7LayerLabels();
  const overlay = kk7Layers.length ? kk7Layers.join(', ') : 'No overlay';
  const time = document.getElementById('timeFilter').checked
    ? `${optionLabel('input[name="season"]:checked')} ${optionLabel('input[name="timeOfDay"]:checked')}`
    : 'All year All day';
  document.getElementById('layerSummary').textContent = `${base} | ${overlay} | ${time} | ${Math.round(layerOpacity() * 100)}%`;
}
function updateOpacityLabel(){
  document.getElementById('thermalOpacityValue').textContent = `${Math.round(layerOpacity() * 100)}%`;
  updateLayerSummary();
}
function setBaseLayer(layerName){
  const nextLayer = baseLayers[layerName] || baseLayers.osm;
  if(activeBaseLayer !== nextLayer){
    map.removeLayer(activeBaseLayer);
    activeBaseLayer = nextLayer;
    activeBaseLayer.addTo(map);
  }
  updateLayerSummary();
}
function removeKk7RasterLayers(){
  Object.keys(activeKk7RasterLayers).forEach((key) => {
    map.removeLayer(activeKk7RasterLayers[key]);
    delete activeKk7RasterLayers[key];
  });
}
function syncKk7RasterLayers(){
  removeKk7RasterLayers();
  const category = kk7Category();
  ['certainty', 'skyways', 'thermals'].forEach((key, index) => {
    const checkbox = document.querySelector(`.kk7-raster-layer[value="${key}"]`);
    if(!checkbox || !checkbox.checked) return;
    const config = kk7RasterLayerConfigs[key];
    activeKk7RasterLayers[key] = L.tileLayer(`https://thermal.kk7.ch/tiles/${config.tileName}_${category}/{z}/{x}/{y}.png?src=${thermalSource()}`, {
      attribution: 'thermal.kk7.ch <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/">CC-BY-NC-SA</a>',
      className: config.className || '',
      maxNativeZoom: config.maxNativeZoom,
      maxZoom: 18,
      opacity: layerOpacity(),
      tms: true,
      zIndex: 300 + index
    }).addTo(map);
  });
  updateLayerSummary();
}
function updateLayerOpacity(){
  updateOpacityLabel();
  Object.values(activeKk7RasterLayers).forEach((layer) => layer.setOpacity(layerOpacity()));
  if(activeHotspotsLayer){
    activeHotspotsLayer.eachLayer((layer) => {
      if(layer.setStyle) layer.setStyle({ opacity: layerOpacity(), fillOpacity: Math.min(.95, layerOpacity() + .25) });
    });
  }
}
function syncSeasonControlState(){
  const enabled = document.getElementById('timeFilter').checked;
  document.querySelectorAll('input[name="season"], input[name="timeOfDay"]').forEach((input) => {
    input.disabled = !enabled;
  });
  updateLayerSummary();
}
function initTimeFilterDefaults(){
  const season = document.querySelector(`input[name="season"][value="${currentSeasonKey()}"]`);
  if(season) season.checked = true;
  const allDay = document.querySelector('input[name="timeOfDay"][value="all"]');
  if(allDay) allDay.checked = true;
  syncSeasonControlState();
  updateOpacityLabel();
}
function removeHotspotsLayer(){
  if(activeHotspotsLayer){
    map.removeLayer(activeHotspotsLayer);
    activeHotspotsLayer = null;
  }
}
function hotspotStyle(feature){
  const probability = Number(feature.properties && feature.properties.probability) || 0;
  return {
    radius: 4 + probability * 5,
    color: '#3a2100',
    weight: 1,
    opacity: layerOpacity(),
    fillColor: '#ffb300',
    fillOpacity: Math.min(.95, layerOpacity() + .25)
  };
}
async function loadHotspots(){
  updateLayerSummary();
  if(!document.getElementById('hotspotsLayer').checked){
    removeHotspotsLayer();
    return;
  }
  const requestId = ++hotspotRequestId;
  const b = map.getBounds();
  const bbox = [b.getSouth(), b.getWest(), b.getNorth(), b.getEast()].map((n) => n.toFixed(6)).join(',');
  const url = `https://thermal.kk7.ch/api/hotspots/geojson/${kk7Category()}/${bbox}?limit=250`;
  try{
    const response = await fetch(url);
    if(!response.ok) throw new Error(`Hotspots ${response.status}`);
    const data = await response.json();
    if(requestId !== hotspotRequestId) return;
    removeHotspotsLayer();
    activeHotspotsLayer = L.geoJSON(data, {
      pointToLayer: (feature, latlng) => L.circleMarker(latlng, hotspotStyle(feature))
    }).addTo(map);
  }catch(error){
    if(requestId === hotspotRequestId) removeHotspotsLayer();
  }
}
function scheduleHotspotsReload(){
  if(!document.getElementById('hotspotsLayer').checked) return;
  clearTimeout(hotspotReloadTimer);
  hotspotReloadTimer = setTimeout(loadHotspots, 250);
}
function refreshKk7Layers(){
  syncSeasonControlState();
  syncKk7RasterLayers();
  loadHotspots();
}

const markers = [];
const bounds = [];
const koreaBounds = [];
function escapeHtml(value){
  return String(value ?? '').replace(/[&<>"']/g, (char) => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[char]));
}
function windguruUrl(id){ return `https://www.windguru.cz/${encodeURIComponent(String(id).replace(/\D/g, ''))}`; }
function addMarker(s){
  const marker = L.marker([s.lat, s.lon]).addTo(map);
  marker.bindPopup(`<div class="popup-title">${escapeHtml(s.place)} ${escapeHtml(s.name)}</div>
    <div class="popup-line"><b>Region:</b> ${escapeHtml(s.region)}</div>
    <div class="popup-line"><b>Info:</b> ${escapeHtml(s.note || '-')}</div>
    <div class="popup-line"><b>Windguru ID:</b> ${escapeHtml(s.id)}</div>
    <a class="wg-btn" target="_blank" rel="noopener noreferrer" href="${windguruUrl(s.id)}">View Windguru</a>`);
  marker.site = s;
  markers.push(marker);
  bounds.push([s.lat, s.lon]);
  if(s.region !== 'Overseas') koreaBounds.push([s.lat, s.lon]);
}
sites.forEach(addMarker);
map.fitBounds(koreaBounds, {padding:[28,28], maxZoom: 8});

const regionSelect = document.getElementById('region');
[...new Set(sites.map(s=>s.region))].sort().forEach(r => {
  const opt = document.createElement('option'); opt.value = r; opt.textContent = r; regionSelect.appendChild(opt);
});
function visibleMarkers(){ return markers.filter(m => map.hasLayer(m)); }
function updateCount(n){ document.getElementById('count').textContent = `Showing: ${n} / total ${sites.length}`; }
function fitVisible(maxZoom=11){
  const visible = visibleMarkers().map(m => [m.site.lat, m.site.lon]);
  if(visible.length) map.fitBounds(visible, {padding:[44,44], maxZoom});
}
function applyFilter({fit=true}={}){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const r = regionSelect.value;
  let visible = [];
  markers.forEach(m => {
    const s = m.site;
    const hitQ = !q || `${s.region} ${s.place} ${s.name} ${s.note} ${s.id}`.toLowerCase().includes(q);
    const hitR = !r || s.region === r;
    if(hitQ && hitR){ if(!map.hasLayer(m)) m.addTo(map); visible.push([s.lat, s.lon]); }
    else { if(map.hasLayer(m)) map.removeLayer(m); }
  });
  updateCount(visible.length);
  if(fit && visible.length) map.fitBounds(visible, {padding:[44,44], maxZoom: 11});
}
function showKorea(){
  document.getElementById('search').value = '';
  regionSelect.value = '';
  markers.forEach(m => {
    if(m.site.region === 'Overseas') map.removeLayer(m); else if(!map.hasLayer(m)) m.addTo(map);
  });
  updateCount(visibleMarkers().length);
  map.fitBounds(koreaBounds, {padding:[28,28], maxZoom: 8});
}
function showAll(){
  document.getElementById('search').value = '';
  regionSelect.value = '';
  markers.forEach(m => { if(!map.hasLayer(m)) m.addTo(map); });
  updateCount(visibleMarkers().length);
  map.fitBounds(bounds, {padding:[28,28], maxZoom: 6});
}
document.getElementById('search').addEventListener('input', () => applyFilter());
regionSelect.addEventListener('change', () => applyFilter());
document.getElementById('btnKorea').addEventListener('click', showKorea);
document.getElementById('btnAll').addEventListener('click', showAll);
document.getElementById('btnClear').addEventListener('click', showKorea);
document.getElementById('toggleLayerPanel').addEventListener('click', () => {
  const layerPanel = document.getElementById('layerPanel');
  const willOpen = layerPanel.hasAttribute('hidden');
  layerPanel.toggleAttribute('hidden', !willOpen);
  document.getElementById('toggleLayerPanel').textContent = willOpen ? 'Close Options' : 'Map Options';
  document.getElementById('toggleLayerPanel').setAttribute('aria-expanded', String(willOpen));
});
document.querySelectorAll('input[name="baseLayer"]').forEach((input) => {
  input.addEventListener('change', (e) => setBaseLayer(e.target.value));
});
document.querySelectorAll('.kk7-raster-layer').forEach((input) => {
  input.addEventListener('change', syncKk7RasterLayers);
});
document.getElementById('hotspotsLayer').addEventListener('change', loadHotspots);
document.getElementById('timeFilter').addEventListener('change', refreshKk7Layers);
document.querySelectorAll('input[name="season"], input[name="timeOfDay"]').forEach((input) => {
  input.addEventListener('change', refreshKk7Layers);
});
document.getElementById('thermalOpacity').addEventListener('input', updateLayerOpacity);
map.on('moveend zoomend', scheduleHotspotsReload);
document.getElementById('togglePanel').addEventListener('click', () => {
  const panel = document.getElementById('panel');
  const collapsed = panel.classList.toggle('collapsed');
  document.getElementById('togglePanel').textContent = collapsed ? '열기' : '접기';
  setTimeout(() => map.invalidateSize(), 120);
});
initTimeFilterDefaults();
syncKk7RasterLayers();
showKorea();
</script>
